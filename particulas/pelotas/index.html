<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Pelotas</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
    <script
      type="module"
      src="index.js"
    ></script>
  </head>
  <body>
    <div class="wrapper">
      <!-- Ball 1 should bounce 30px over 300ms -->
      <div
        style="--altura: -30px; --tiempo: 300ms"
        class="ball"
      ></div>

      <!-- Ball 2 should bounce 50px over 400ms -->
      <div
        style="--altura: -50px; --tiempo: 400ms"
        class="ball"
      ></div>

      <!-- Ball 3 should bounce 70px over 500ms -->
      <div
        style="--altura: -70px; --tiempo: 500ms"
        class="ball"
      ></div>
    </div>
  </body>
</html>
